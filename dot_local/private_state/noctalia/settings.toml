config_version = 14

[bar.default]
background_opacity = 0.97999997809529305
capsule = true
capsule_padding = 7.0
capsule_thickness = 0.74999998696148396
center = [ "launcher", "clock", "notifications" ]
end = [
    "privacy",
    "keyboard_layout",
    "tray",
    "recorder",
    "ocr",
    "screenshot",
    "color_picker",
    "widget_2",
    "clipboard",
    "wallpaper",
    "session"
]
margin_ends = 0
padding = 8
start = [ "active_window", "workspaces" ]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1738.0
    output = "HDMI-A-1"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.99999997764825821

[osd]
background_opacity = 0.99999997764825821
offset_x = 25
offset_y = 150
position = "bottom_center"

    [osd.kinds]
    media = false

[plugin_settings."autumn/network-toolkit"]
refreshinterval = 10

[plugin_settings."noctalia/screen_recorder"]
directory = "/home/alvaniss/Videos"
frame_rate_mode = "cfr"
replay_duration = 120
replay_enabled = true
resolution = "2560x1440"
video_bitrate = "30000"
video_bitrate_mode = "cbr"
video_source = "focused"

[plugins]
enabled = [ "autumn/network-toolkit", "fel/ocr", "noctalia/screen_recorder" ]

[shell]
app_icon_colorize = true
font_family = "Readex Pro"

    [shell.launcher]
    app_grid = true
    pinned = [ "helium", "kitty", "obsidian", "dev.zed.Zed", "steam" ]
    show_app_actions = true

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    open_near_click_clipboard = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/alvaniss/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "ungoogled-chromium", "zen-browser", "neovim", "obsidian", "zed" ]

[wallpaper]
directory = "/home/alvaniss/Wallpapers"

    [wallpaper.default]
    path = "/home/alvaniss/Wallpapers/Art_3.png"

    [wallpaper.last]
    path = "/home/alvaniss/Wallpapers/Art_3.png"

    [wallpaper.monitors.DP-2]
    path = "/home/alvaniss/Wallpapers/Art_3.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/alvaniss/Wallpapers/Art_3.png"

[widget.color_picker]
glyph = "color-picker"
type = "custom_button"

    [widget.color_picker.actions]
    left = "exec hyprpicker -a"

[widget.ocr]
type = "fel/ocr:ocr"

[widget.privacy]
active_color = "#FFFFFF"
capsule = true
capsule_fill = "#FC7524"
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
hide_passive = false

[widget.widget_2]
type = "autumn/network-toolkit:widget"

[widget.workspaces]
capsule = true
capsule_radius = "auto"
style = "minimal"
urgent_color = "primary"