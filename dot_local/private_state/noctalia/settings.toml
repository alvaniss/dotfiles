config_version = 16

[bar.default]
background_opacity = 0.97999997809529305
capsule = true
capsule_padding = 7.0
capsule_thickness = 0.74999998696148396
center = [ "launcher", "clock", "notifications" ]
end = [
    "privacy",
    "keyboard_layout",
    "separator",
    "tray",
    "separator",
    "recorder",
    "ocr",
    "screenshot",
    "color_picker",
    "clipboard",
    "wallpaper",
    "separator",
    "media",
    "volume",
    "separator",
    "session"
]
margin_ends = 0
padding = 8
start = [ "active_window", "workspaces" ]

[brightness]
enable_ddcutil = true

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821

[lockscreen]
blur_intensity = 0.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@FALLBACK",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-0000000000000001"
