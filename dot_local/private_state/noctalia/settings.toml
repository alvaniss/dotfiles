[notification]
background_opacity = 0.99999997764825821
filter_order = [ "filter" ]
history_retention_hours = 24

    [notification.filter.filter]
    allow_permanent = false
    bypass_dnd = false
    enabled = true
    match = "amneziavpn"
    play_sound = false
    save_history = false
    show_toast = false

[osd]
background_opacity = 0.99999997764825821
offset_x = 25
offset_y = 150
position = "bottom_center"

    [osd.kinds]
    media = false

[plugin_settings."autumn/network-toolkit"]
refreshinterval = 10

[plugin_settings."noctalia/screen_recorder"]
directory = "/home/alvaniss/Videos"
frame_rate_mode = "cfr"
replay_duration = 120
replay_enabled = true
resolution = "2560x1440"
video_bitrate = "30000"
video_bitrate_mode = "cbr"
video_source = "focused"

[plugins]
enabled = [ "autumn/network-toolkit", "fel/ocr", "noctalia/screen_recorder" ]

[shell]
clipboard_history_max_entries = 50
font_family = "Readex Pro"

    [shell.animation]
    speed = 1.2500000186264515

    [shell.launcher]
    app_grid = true
    categories = false
    layout = "simple"
    pinned = [
        "helium",
        "kitty",
        "obsidian",
        "dev.zed.Zed",
        "steam",
        "org.telegram.desktop",
        "zen",
        "AmneziaVPN",
        "org.keepassxc.KeePassXC",
        "blender",
        "localsend",
        "firefox"
    ]
    show_app_actions = true

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/alvaniss/Screenshots"

    [shell.session]
    grid_columns = 1

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "hyprctl dispatch 'hl.dsp.dpms({action = \"disable\"})'"
        countdown_seconds = 1.0
        enabled = true
        glyph = "device-desktop-off"
        label = "Monitor Off"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kitty", "qt" ]
    community_ids = [ "chromium-based", "pywalfox", "ungoogled-chromium", "zen-browser", "neovim", "obsidian", "zed" ]

[wallpaper]
directory = "/home/alvaniss/Wallpapers"

    [wallpaper.default]
    path = "/home/alvaniss/Wallpapers/HTjTdX9bMAAAOKi.jpg"

    [wallpaper.last]
    path = "/home/alvaniss/Wallpapers/HTjTdX9bMAAAOKi.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/alvaniss/Wallpapers/HTjTdX9bMAAAOKi.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/alvaniss/Wallpapers/HTjTdX9bMAAAOKi.jpg"

[widget.color_picker]
glyph = "color-picker"
type = "custom_button"

    [widget.color_picker.actions]
    left = "exec hyprpicker -a"

[widget.media]
artist_first = true
hide_when_no_media = true
max_length = 256

[widget.ocr]
type = "fel/ocr:ocr"

[widget.privacy]
active_color = "#FFFFFF"
capsule = true
capsule_fill = "#FC7524"
hide_inactive = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.separator]
capsule = false
color = "outline_variant"
scale = 0.85000000000000009
text = " | "
type = "text"

[widget.tray]
hide_passive = false

[widget.workspaces]
capsule = true
capsule_radius = "auto"
style = "minimal"
urgent_color = "primary"